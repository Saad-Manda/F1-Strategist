id: p5-01
title: One update, many states
page: phase-5-dqn-prerequisites/01-table-to-function.html
format: notebook
minutes: 15
tasks: [update, "predict:spread", A, learning, "predict:few-walks", B, C]
goal: >-
  You will write one gradient step for a small network, make one update with it and one with a table, and see what moved. Then you measure what the network's sharing buys when data is scarce, and what it costs when the data all comes from one place.
environment: >-
  the 1000-state random walk from lab p4-05 (Sutton &amp; Barto, Example 9.1), with a network of two hidden layers of 32 units.
