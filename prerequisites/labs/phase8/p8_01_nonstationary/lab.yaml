id: p8-01
title: When the opponent learns too
page: phase-8-self-play-prerequisites/01-non-stationarity-revisited.html
format: notebook
minutes: 15
tasks: [A, "predict:settle", B]
goal: >-
  Put two of Phase 4's simplest learners against each other in matching pennies and watch neither settle, because each is the other's moving environment. Then fill a replay buffer against an opponent that has since changed, and measure how wrong the replayed values are about the game being played now.
environment: >-
  matching pennies: two players show heads or tails, one wins on a match, the other on a mismatch, and no action is best against everything.
