id: p8-07
title: Is it really a reaction?
page: phase-8-self-play-prerequisites/07-is-it-bimodal.html
format: notebook
minutes: 20
tasks: [A, "predict:sc", B, C]
goal: >-
  Build page 07's shuffled-pairing test, then run it on three synthetic data sets: independent stops, two cars that both react to the same safety car but never to each other, and a real undercut-or-overcut reaction. The plain shuffle calls the shared safety car a reaction. Fix it by shuffling only among races that shared the same conditions, and finish with a strategic histogram the test cannot see at all.
environment: >-
  synthetic pit-stop data for 2,000 races of 52 laps (labs/labkit/pitdata.py), and the capstone's pit-timing duel for the last part.
