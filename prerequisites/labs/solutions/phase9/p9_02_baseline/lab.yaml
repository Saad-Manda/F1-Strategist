id: p9-02
title: What a baseline buys
page: phase-9-ppo-prerequisites/02-actor-critic-advantage.html
format: notebook
minutes: 20
tasks: [A, B, C, "predict:offset", D]
goal: >-
  Page 02 claims a baseline leaves the gradient's average alone and shrinks its noise. Measure both halves on the corridor, prove the first one exactly with arithmetic, then learn the baseline as you go. Last, the case that matters for a race whose rewards are minus lap times: what a baseline does when every reward sits far from zero.
environment: >-
  the short corridor with switched actions from p9-01, and a two-armed bandit (rewards N(1, 2) and N(0, 0.5)) with a constant added to every reward.
