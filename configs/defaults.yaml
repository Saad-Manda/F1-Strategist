calibration:
  paths:
    processed: data/processed

  conditions:
    min_known_tyre_share: 0.5     # D29
    damp_start_share: 0.3         # D28
    damp_end_share: 0.7           # D28
    wet_share: 0.5
    median_filter_laps: 3
    max_padded_laps: 3

  fuel:
    consumption_kg_per_lap: 1.9
    sensitivity_s_per_kg: 0.033

  tyres:
    fit_seasons: [2022, 2023, 2024]  # D11, D32
    min_lap: 4
    min_tyre_age: 3
    max_gap_to_median_s: 3.0
    long_stint_quantile: 0.95
    cliff_cap: 4.0
    cliff:
      SOFT: {age: 18, severity: 0.35}
      MEDIUM: {age: 28, severity: 0.30}
      HARD: {age: 38, severity: 0.25}
      INTERMEDIATE: {age: 28, severity: 0.30}
      WET: {age: 28, severity: 0.30}
    rain_tyre_wear:
      INTERMEDIATE: 0.05
      WET: 0.05

  pit_stops:
    min_lap: 4
    min_peers: 4

  flag_laps:
    min_lap: 4
    noise_std: 1.0

  weather:
    min_lap: 4

  checks:                         # frozen 2026-11-26 (D38); change one only with a decisions entry
    tolerance: 1.0e-9
    landscape:
      three_stop_grid_laps: 3
      stop_shift_laps: 5
      window_s: 1.0
    ordering:                     # K2
      offset_gap_s: 0.05
      wear_ratio: 1.05
      cliff_gap_laps: 1
    ranges:                       # K3
      pit_loss: [12.0, 35.0]
      base_pace: [60.0, 130.0]
      base_deg: [0.003, 0.25]
      pit_loss_multiplier: [0.0, 1.0]
      flag_lap_share: [1.0, 2.5]
    cliffs:                       # K4
      stint_factor: 1.3
      max_degradation_s: 8.0
    chains:                       # K5
      forbidden:
        status: []
        weather: [[DRY, WET], [WET, DRY]]
      safety_car_laps: [0.5, 8.0]
    timing:                       # K6
      min_shift_cost_s: 0.3
      max_window_laps: 16
    compounds:                    # K7: tyre choices, each at its best number of stops (D37)
      min_spread_s: 1.0
      close_s: 10.0
      min_close_choices: 2
    fitted_support:               # K8
      base_pace: {diagnostic: tyres.clean_laps, min: 300}
      noise_std: {diagnostic: tyres.clean_laps, min: 300}
      pit_loss: {diagnostic: pit_stops.green_stops, min: 20}
    min_noise_std: 0.2            # K9

  warmup_second_lap_share: 0.3

  warmup_defaults:                # D33: the measured pit loss includes it
    SOFT: 0.0
    MEDIUM: 0.0
    HARD: 0.0
    INTERMEDIATE: 0.0
    WET: 0.0

  weather_penalty_defaults:
    DRY:
      SOFT: 0.0
      MEDIUM: 0.0
      HARD: 0.0
      INTERMEDIATE: 4.0
      WET: 10.0
    DAMP:
      SOFT: 6.0
      MEDIUM: 4.0
      HARD: 3.0
      INTERMEDIATE: 0.0
      WET: 2.5
    WET:
      SOFT: 15.0
      MEDIUM: 12.0
      HARD: 10.0
      INTERMEDIATE: 3.0
      WET: 0.0
