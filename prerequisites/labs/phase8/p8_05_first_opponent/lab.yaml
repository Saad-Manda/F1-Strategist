id: p8-05
title: The first opponent
page: phase-8-self-play-prerequisites/05-first-opponent-problem.html
format: notebook
minutes: 15
tasks: ["predict:same", A, B]
goal: >-
  Play thirty untrained copies of the Phase 5 plan's network greedily through one race and count how many do the same thing on every lap. Then give "how varied is this policy" a number, the entropy of the actions it picks, and compare the plan's seed with a random policy and a simple rule.
environment: >-
  no race simulator: observation vectors of the plan's shape (19 numbers in [0, 1]), fed to the plan's DuelingDQN architecture, untrained.
hints:
